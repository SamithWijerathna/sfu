# Meetra coturn config. Change realm, external-ip, user password before production.
listening-port=3478
fingerprint
lt-cred-mech

# IMPORTANT: Use your domain or public IP.
realm=turn.yourdomain.com
server-name=turn.yourdomain.com

# Format: username:password
user=meetra:change_this_strong_turn_password

# Use your server public IP. If the VPS has a private interface, use PUBLIC_IP/PRIVATE_IP.
# Example single public IP VPS:
# external-ip=203.0.113.10
external-ip=YOUR_SERVER_PUBLIC_IP

# Relay ports for TURN traffic. Open this UDP range in the firewall.
min-port=49152
max-port=65535

no-cli
no-tls
no-dtls
log-file=stdout
simple-log
